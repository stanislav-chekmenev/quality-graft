# Training configuration
optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  betas: [0.9, 0.999]

scheduler:
  type: linear
  warmup_steps: 200
  min_lr: 1.0e-6

# Trainer & data configuration
max_length: 256
min_length: 128
batch_size: 16
num_workers: 16
precision: bf16
max_epochs: 50
gradient_clip_val: 1.0
accumulate_grad_batches: 1
accelerator: auto
devices: 1
strategy: auto
log_every_n_steps: 1
limit_val_batches: 1.0
check_val_every_n_epoch: 50
checkpoint_dir: ckpt
debug_mode: false

# Early stopping
early_stopping:
  enabled: true
  monitor: val/plddt_accuracy
  mode: max
  patience: 5

# Checkpoint monitoring
checkpoint:
  monitor: val/plddt_accuracy
  mode: max
  save_top_k: 3

# W&B configuration
wandb:
  project: quality-graft
  entity: null
  run_name: null
  log_preprocess: true
