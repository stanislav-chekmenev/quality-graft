# Dataset config: ~500 high-quality monomeric proteins, max length 128, with pLDDT labels
#
# Fraction estimate: The full PDB contains ~10,000 monomeric protein chains with
# length <= 128, resolution <= 2.5 A, from diffraction/EM experiments. A fraction
# of 0.05 should yield ~500 chains (actual count depends on PDB state at download time).
data_dir: /scratch/schekmenev/monomers_max_len_128_plddt_boltz
max_length: ${training.max_length}
min_length: 10
molecule_type: protein
oligomeric_min: 1
oligomeric_max: 1
format: cif
local_only: true
num_plddt_bins: 50
train_val_test: [0.8, 0.15, 0.05]
batch_size: ${training.batch_size}
num_workers: ${training.num_workers}

# PDBDataSelector filtering params
fraction: 1.0
worst_resolution: 2.5
best_resolution: null
experiment_types: ["diffraction", "EM"]
selector_num_workers: 32

boltz:
  model: boltz1
  diffusion_samples: 1
  sampling_steps: 50
  recycling_steps: 1
  accelerator: gpu
  use_msa_server: false
  chunk_size: 10
  timeout_per_structure: 300  # seconds; chunk timeout = chunk_size * this + 120s
  num_devices: 1  # Number of GPUs for Boltz --devices flag
  num_workers: 2  # Boltz dataloader workers
  preprocessing_threads: null  # null = Boltz default (cpu_count)
  max_parallel_samples: null  # null = Boltz default (5)
