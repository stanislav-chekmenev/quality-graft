# Dataset configuration
data_dir: data/pdb/
max_length: ${training.max_length}
min_length: 10
molecule_type: protein
oligomeric_min: 1
oligomeric_max: 1
format: cif
num_plddt_bins: 50
batch_size: ${training.batch_size}
num_workers: ${training.num_workers}

boltz:
  model: boltz1
  diffusion_samples: 1
  sampling_steps: 200
  recycling_steps: 3
  devices: 1
  accelerator: gpu
  use_msa_server: false