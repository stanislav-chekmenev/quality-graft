# Dataset configuration
data_dir: data/pdb/
max_length: ${training.max_length}
min_length: ${training.min_length}
molecule_type: protein
oligomeric_min: 1
oligomeric_max: 1
format: cif
local_only: false
reprocess_boltz: false
num_plddt_bins: 50
train_val_test: [0.8, 0.15, 0.05]
batch_size: ${training.batch_size}
num_workers: ${training.num_workers}

# PDBDataSelector filtering params (null = use PDBDataSelector defaults)
fraction: 1.0
worst_resolution: null
best_resolution: null
experiment_types: null
selector_num_workers: 32

boltz:
  model: boltz1
  diffusion_samples: 1
  sampling_steps: 50
  recycling_steps: 1
  accelerator: gpu
  use_msa_server: false
  chunk_size: 6
  timeout_per_structure: 120  # seconds; chunk timeout = chunk_size * this + 120s
  num_devices: 1  # Number of GPUs for Boltz --devices flag
  num_workers: 2  # Boltz dataloader workers
  preprocessing_threads: null  # null = Boltz default (cpu_count)
  max_parallel_samples: null  # null = Boltz default (5)