# Student confidence head configuration (distillation)
# Replaces BoltzConfidenceHead (152.7M frozen) with a trainable student (~11M).

_target_: quality_graft.models.student_head.StudentConfidenceHead

# Core dims (must match adaptor output)
token_s: 384
token_z: 128

# Pairformer architecture
num_blocks: 4            # 4 blocks ≈ 10.8M + heads ≈ ~11.2M total
num_heads: 16
dropout: 0.2
pairwise_head_width: 32
pairwise_num_heads: 4

# Prediction heads
num_plddt_bins: 50
num_pde_bins: 64
predict_pde: true         # multi-task regularization
predict_resolved: true    # multi-task regularization
