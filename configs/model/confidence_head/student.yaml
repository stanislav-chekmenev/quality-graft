# Student confidence head configuration (distillation)
# Replaces BoltzConfidenceHead (152.7M frozen) with a trainable student (~11M).

_target_: quality_graft.models.student_head.StudentConfidenceHead

# Core dims (must match adaptor output)
token_s: 384
token_z: 128

# Pairformer architecture
num_blocks: 1            
num_heads: 8
dropout: 0.5
pairwise_head_width: 16
pairwise_num_heads: 2

# Prediction heads
num_plddt_bins: 50
num_pde_bins: 64
predict_pde: false         # multi-task regularization
predict_resolved: false    # multi-task regularization
