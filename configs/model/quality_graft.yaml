# Quality-Graft full model configuration
# See plans/architecture.md Section 5.4 for architecture details.
#
# This config defines the full assembled model:
#   La-Proteina (frozen) → Adaptor (trainable) → Boltz1 Confidence Head (frozen)
#
# Sub-module configs are referenced below.  The adaptor is instantiated
# directly via Hydra's _target_ mechanism.  The La-Proteina wrapper and
# confidence head require special construction (factory methods / checkpoint
# loading), so their config values are used programmatically.

# Adaptor: directly instantiable via Hydra
adaptor:
  _target_: quality_graft.models.adaptor.AdaptorModule
  source_mode: ${model.la_proteina_wrapper.source_mode_derived}
  trunk_dim: 768
  pair_dim: 256
  latent_dim: 8
  target_s_dim: 384
  target_z_dim: 128
  n_attn_layers: 2
  num_heads: 16
  s_ff_factor: 2
  z_ff_factor: 2

# La-Proteina wrapper config (used by factory method, not _target_)
la_proteina_wrapper:
  proteina_ckpt_path: ckpt/LD1_ucond_notri_512.ckpt
  autoencoder_ckpt_path: ckpt/AE1_ucond_512.ckpt
  device: cpu
  use_decoder: false
  t_value: 1.0
  deterministic_encode: true
  # Derived field: adaptor source_mode matches use_decoder
  source_mode_derived: "trunk"  # "trunk" when use_decoder=false, "hybrid" when true

# Confidence head config provided by config group model/confidence_head (boltz or student)
