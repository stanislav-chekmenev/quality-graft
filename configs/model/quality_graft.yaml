# Quality-Graft full model configuration
# See plans/architecture.md Section 5.4 for architecture details.
#
# This config defines the full assembled model:
#   La-Proteina (frozen) → Adaptor (trainable) → Boltz1 Confidence Head (frozen)
#
# Sub-module configs are referenced below.  The adaptor is instantiated
# directly via Hydra's _target_ mechanism.  The La-Proteina wrapper and
# confidence head require special construction (factory methods / checkpoint
# loading), so their config values are used programmatically.

# Adaptor: directly instantiable via Hydra
adaptor:
  _target_: quality_graft.models.adaptor.AdaptorModule
  source_mode: ${model.la_proteina_wrapper.source_mode_derived}
  trunk_dim: 768
  pair_dim: 256
  latent_dim: 8
  target_s_dim: 384
  target_z_dim: 128
  n_attn_layers: 2
  num_heads: 16
  s_ff_factor: 2
  z_ff_factor: 2

# La-Proteina wrapper config (used by factory method, not _target_)
la_proteina_wrapper:
  proteina_ckpt_path: ckpt/LD1_ucond_notri_512.ckpt
  autoencoder_ckpt_path: ckpt/AE1_ucond_512.ckpt
  device: cpu
  use_decoder: false
  t_value: 1.0
  deterministic_encode: true
  # Derived field: adaptor source_mode matches use_decoder
  source_mode_derived: "trunk"  # "trunk" when use_decoder=false, "hybrid" when true

# Confidence head config (used by constructor with checkpoint loading)
confidence_head:
  _target_: quality_graft.models.confidence_head.BoltzConfidenceHead
  device: cpu
  freeze: true
  strict_loading: true
  ckpt_path: ckpt/boltz1_conf.ckpt
  ckpt_prefix: "confidence_module."
  token_s: 384
  token_z: 128
  compute_pae: true
  imitate_trunk: true
  confidence_model_args:
    num_dist_bins: 64
    max_dist: 22
    add_s_to_z_prod: true
    add_s_input_to_s: true
    use_s_diffusion: true
    add_z_input_to_z: true
    confidence_args:
      num_plddt_bins: 50
      num_pde_bins: 64
      num_pae_bins: 64
  pairformer_args:
    num_blocks: 48
    num_heads: 16
    dropout: 0.25
    post_layer_norm: false
    activation_checkpointing: false
    offload_to_cpu: false
  full_embedder_args:
    atom_s: 128
    atom_z: 16
    token_s: 384
    token_z: 128
    atoms_per_window_queries: 32
    atoms_per_window_keys: 128
    atom_feature_dim: 389
    no_atom_encoder: false
    atom_encoder_depth: 3
    atom_encoder_heads: 4
  msa_args:
    msa_s: 64
    msa_blocks: 4
    msa_dropout: 0.15
    z_dropout: 0.25
    pairwise_head_width: 32
    pairwise_num_heads: 4
    postpone_outer_product: true
    activation_checkpointing: false
    offload_to_cpu: false
